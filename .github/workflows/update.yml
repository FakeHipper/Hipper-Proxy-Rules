name: 规则核验与发布

on:
  schedule:
    - cron: '17 1 * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - Hipper.conf
      - Hipper.yaml
      - refresh.py
      - .github/workflows/update.yml
  pull_request:
    paths:
      - Hipper.conf
      - Hipper.yaml
      - refresh.py
      - .github/workflows/update.yml

permissions:
  contents: read

concurrency:
  group: proxy-publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - run: python -m pip install PyYAML==6.0.3
      - run: python refresh.py
  publish:
    if: github.event_name != 'pull_request' && github.ref_name == 'main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - run: python -m pip install PyYAML==6.0.3
      - run: python refresh.py
      - name: 仅提交核验后的配置与摘要
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add Hipper.conf Hipper.yaml rule-health.json
          if ! git diff --cached --quiet; then
            git commit -m '更新规则核验摘要'
            git push
          fi
